name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  protobuf-policy-option:
    name: protobuf_policy_option
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: protobuf_policy_option/go.mod
          cache-dependency-path: protobuf_policy_option/go.sum

      - name: vet
        working-directory: protobuf_policy_option
        run: go vet ./...

      - name: test
        working-directory: protobuf_policy_option
        run: go test ./... -count=1

  policy-verification:
    name: policy_verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: policy_verification/go.mod
          cache-dependency-path: policy_verification/go.sum

      - name: vet
        working-directory: policy_verification
        run: go vet ./...

      - name: test
        working-directory: policy_verification
        run: go test ./... -count=1
