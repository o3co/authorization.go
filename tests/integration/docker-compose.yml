services:
  opa:
    image: openpolicyagent/opa:1.5.0
    platform: linux/amd64
    command: run --server --addr=0.0.0.0:8181 /policies
    ports:
      - "8181:8181"
    volumes:
      - ./testdata/opa:/policies
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 2s
      timeout: 2s
      retries: 10

  cedar-agent:
    image: permitio/cedar-agent:0.2.2
    ports:
      - "8180:8180"
    environment:
      CEDAR_AGENT_ADDR: "0.0.0.0"
      CEDAR_AGENT_POLICIES: /data/policies.json
      CEDAR_AGENT_DATA: /data/entities.json
    volumes:
      - ./testdata/cedar:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8180'"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
